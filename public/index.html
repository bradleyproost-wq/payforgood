<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyFlow</title><link rel="manifest" href="/manifest.json"><style>
:root{--bg:#0b1020;--card:#111a2e;--muted:#8ea0c4;--text:#eef5ff;--green:#22c55e;--red:#ef4444;--line:#22304d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(135deg,#08101f,#111827);color:var(--text)}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(17,26,46,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0004}.muted{color:var(--muted)}input,select,button,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #33415f;background:#0b1326;color:var(--text);margin:6px 0}button{background:var(--green);color:#04110a;font-weight:800;cursor:pointer;border:none}.btn2{background:#1d2840;color:var(--text)}.danger{background:var(--red);color:white}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{min-width:max-content;background:#142038;color:var(--text)}.tabs button.active{background:var(--green);color:#04110a}.hide{display:none}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.qr{max-width:160px;border-radius:12px;background:white}.pill{border-radius:99px;padding:5px 10px;background:#1d2840;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">💸 MoneyFlow</div><div class="muted">แบ่งเงิน จัดงบ บัญชี QR และสุขภาพการเงิน</div></div><button id="logout" class="btn2 hide" style="width:auto">ออกจากระบบ</button></div>
<div id="auth" class="card" style="max-width:440px;margin:40px auto"><h2>เข้าสู่ระบบ / สมัครสมาชิก</h2><input id="regName" placeholder="ชื่อ (ใช้ตอนสมัคร)"><input id="authEmail" placeholder="อีเมล"><input id="authPassword" type="password" placeholder="รหัสผ่าน"><button onclick="register()">สมัครสมาชิก</button><button class="btn2" onclick="login()">Login</button><p id="authMsg" class="muted"></p></div>
<div id="app" class="hide"><div class="tabs" id="tabs"></div><div id="summary" class="grid"></div><div id="page"></div></div></div><script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});let DATA={},USER=null,TAB='dashboard';const pages=['dashboard','split','plans','accounts','history','budget','goals','debts','networth','recurring','backup'];const th={dashboard:'Dashboard',split:'แบ่งเงิน',plans:'Plans',accounts:'Accounts + QR',history:'History',budget:'Budget',goals:'Goals',debts:'Debt',networth:'Net Worth',recurring:'Recurring',backup:'Backup'};function fmt(n){return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' ฿'}async function api(u,opt={}){const r=await fetch(u,{headers: opt.body instanceof FormData?{}:{'Content-Type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'error');return j}async function boot(){let m=await api('/api/me');USER=m.user;auth.classList.toggle('hide',!!USER);app.classList.toggle('hide',!USER);logout.classList.toggle('hide',!USER); if(USER) await load()}async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({name:document.getElementById('regName').value.trim(),email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value})});boot()}catch(e){authMsg.textContent=e.message}}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value})});boot()}catch(e){authMsg.textContent=e.message}}logout.onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};async function load(){DATA=await api('/api/data');render()}function render(){tabs.innerHTML=pages.map(p=>`<button onclick="TAB='${p}';render()" class="${TAB==p?'active':''}">${th[p]}</button>`).join('');summary.innerHTML=`<div class=card><div class=muted>เงินสด/บัญชี</div><h2>${fmt(DATA.summary.cash)}</h2></div><div class=card><div class=muted>Net Worth</div><h2>${fmt(DATA.summary.netWorth)}</h2></div><div class=card><div class=muted>หนี้คงเหลือ</div><h2>${fmt(DATA.summary.debtLeft)}</h2></div><div class=card><div class=muted>Financial Score</div><h2>${DATA.summary.score}/100</h2></div>`; window['page_'+TAB]()}function del(route,id){api('/api/'+route+'/'+id,{method:'DELETE'}).then(load)}function form(html,fn){page.innerHTML=html; window.submitForm=fn}
function page_dashboard(){page.innerHTML=`<div class=grid><div class=card><h3>สรุป</h3><p>Saving Rate: ${DATA.summary.savingRate}%</p><p>Debt Ratio: ${DATA.summary.debtRatio}%</p></div><div class=card><h3>แผนล่าสุด</h3>${DATA.plans.slice(0,3).map(p=>`<div class=row><b>${p.name}</b><span>${p.items.length} หมวด</span></div>`).join('')}</div><div class=card><h3>Goals</h3>${DATA.goals.slice(0,4).map(g=>`<div>${g.name}<br><progress value="${g.current}" max="${g.target}"></progress> ${fmt(g.current)}/${fmt(g.target)}</div>`).join('')}</div><div class=card><h3>Budget</h3>${DATA.budgets.slice(0,5).map(b=>`<div class=row><span>${b.category}</span><b>${fmt(b.spent)} / ${fmt(b.limit_amount)}</b></div>`).join('')}</div></div>`}
function page_split(){let p=DATA.plans[0]||{name:'Manual',items:[{name:'ลงทุน',percent:40},{name:'หนี้',percent:30},{name:'เก็บ',percent:20},{name:'ใช้',percent:10}]};page.innerHTML=`<div class=card><h2>แบ่งเงิน</h2><input id=amt type=number placeholder="ยอดเงิน"><select id=planSel>${DATA.plans.map(x=>`<option value=${x.id}>${x.name}</option>`).join('')}</select><button onclick="doSplit()">คำนวณและบันทึก</button><div id=splitOut></div></div>`}async function doSplit(){let p=DATA.plans.find(x=>x.id==planSel.value);let j=await api('/api/split',{method:'POST',body:JSON.stringify({amount:amt.value,planName:p.name,items:p.items})});splitOut.innerHTML=j.items.map(i=>`<div class=row><span>${i.name} ${i.percent}%</span><b>${fmt(i.amount)}</b></div>`).join('');load()}
function page_plans(){page.innerHTML=`<div class=card><h2>เพิ่ม Plan</h2><input id=pn placeholder="ชื่อแผน"><textarea id=pi rows=5 placeholder='ตัวอย่าง: ลงทุน,40\nหนี้,30\nเก็บ,20\nใช้,10'></textarea><button onclick="addPlan()">บันทึก</button></div><div class=list>${DATA.plans.map(p=>`<div class=card><div class=row><h3>${p.name}</h3><button class=danger style="width:auto" onclick="del('plans',${p.id})">ลบ</button></div>${p.items.map(i=>`<span class=pill>${i.name} ${i.percent}%</span> `).join('')}</div>`).join('')}</div>`}async function addPlan(){let items=pi.value.split('\n').map(x=>x.split(',')).filter(x=>x[0]).map(x=>({name:x[0].trim(),percent:Number(x[1]||0)}));let total=items.reduce((a,b)=>a+b.percent,0);if(total!==100)return alert('เปอร์เซ็นต์รวมต้อง 100');await api('/api/plans',{method:'POST',body:JSON.stringify({name:pn.value,items})});load()}
function page_accounts(){page.innerHTML=`<div class=card><h2>เพิ่มบัญชี + QR</h2><input id=an placeholder="ชื่อบัญชี"><input id=at placeholder="ประเภท เช่น SCB/KBank/Cash"><input id=ab type=number placeholder="ยอดเงิน"><input id=qr type=file accept="image/*"><button onclick="addAcc()">บันทึก</button></div><div class=list>${DATA.accounts.map(a=>`<div class=card><div class=row><div><h3>${a.name}</h3><div class=muted>${a.type} • ${fmt(a.balance)}</div></div><button class=danger style="width:auto" onclick="del('accounts',${a.id})">ลบ</button></div>${a.qr_path?`<a href="${a.qr_path}" target=_blank><img class=qr src="${a.qr_path}"></a>`:''}</div>`).join('')}</div>`}async function addAcc(){let f=new FormData();f.append('name',an.value);f.append('type',at.value);f.append('balance',ab.value);if(qr.files[0])f.append('qr',qr.files[0]);await api('/api/accounts',{method:'POST',body:f});load()}
function page_history(){page.innerHTML=`<div class=list>${DATA.splits.map(s=>`<div class=card><div class=row><div><h3>${fmt(s.amount)} <span class=pill>${s.status}</span></h3><div class=muted>${s.plan_name} • ${s.created_at}</div></div><div><button style="width:auto" onclick="api('/api/splits/${s.id}/done',{method:'POST'}).then(load)">โอนแล้ว</button><button class=danger style="width:auto" onclick="del('splits',${s.id})">ลบ</button></div></div>${s.items.map(i=>`<div class=row><span>${i.name} ${i.percent}%</span><b>${fmt(i.amount)}</b></div>`).join('')}</div>`).join('')}</div>`}
function page_budget(){simple('budgets','Budget รายเดือน',['month','category','limit_amount','spent'],DATA.budgets)}function page_goals(){simple('goals','Goals',['name','target','current'],DATA.goals)}function page_debts(){simple('debts','Debt Tracker',['name','total','paid','min_payment'],DATA.debts)}function page_recurring(){simple('recurring','Recurring',['name','kind','amount','frequency','day'],DATA.recurring)}function page_networth(){page.innerHTML=`<div class=card><h2>Assets</h2><input id=asname placeholder="ชื่อทรัพย์สิน"><input id=askind placeholder="ประเภท"><input id=asvalue type=number placeholder="มูลค่า"><button onclick="api('/api/assets',{method:'POST',body:JSON.stringify({name:asname.value,kind:askind.value,value:asvalue.value})}).then(load)">เพิ่ม</button></div><div class=list>${DATA.assets.map(a=>`<div class=card><div class=row><span>${a.name} (${a.kind})</span><b>${fmt(a.value)}</b><button class=danger style="width:auto" onclick="del('assets',${a.id})">ลบ</button></div></div>`).join('')}</div>`}function page_backup(){page.innerHTML=`<div class=card><h2>Backup JSON</h2><button onclick="downloadBackup()">ดาวน์โหลดข้อมูล</button><textarea rows=12>${JSON.stringify(DATA,null,2)}</textarea></div>`}function downloadBackup(){let blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moneyflow-backup.json';a.click()}function simple(route,title,fields,rows){page.innerHTML=`<div class=card><h2>${title}</h2>${fields.map(f=>`<input id="f_${f}" placeholder="${f}" ${['limit_amount','spent','target','current','total','paid','min_payment','amount','day'].includes(f)?'type=number':''}>`).join('')}<button onclick="addSimple('${route}','${fields.join('|')}')">เพิ่ม</button></div><div class=list>${rows.map(r=>`<div class=card><div class=row><div>${fields.map(f=>`<b>${f}</b>: ${r[f]}`).join('<br>')}</div><button class=danger style="width:auto" onclick="del('${route}',${r.id})">ลบ</button></div></div>`).join('')}</div>`}async function addSimple(route,fs){let body={};fs.split('|').forEach(f=>body[f]=document.getElementById('f_'+f).value);await api('/api/'+route,{method:'POST',body:JSON.stringify(body)});load()}boot();
</script></body></html>
